# Oracle Database 23ai Free cho Đề tài 25 – Medicore Web Health
# Chạy: docker compose up -d
services:
  oracle23ai:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle23ai
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in the root .env file}
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle23ai_data:/opt/oracle/oradata
      - ./sql:/tmp/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  oracle23ai_data:
